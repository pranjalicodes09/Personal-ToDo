<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="auth-section" class="portal-wrapper">
    <div class="portal-card">
      <div class="portal-logo" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 56 56" fill="none">
          <rect x="4" y="4" width="48" height="48" rx="16" fill="#111827" stroke="#CBD5E1" stroke-width="1.5" />
          <path d="M19 20H37M19 28H31M19 36H26" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="36" cy="35" r="5" fill="#F8FAFC" />
          <path d="M34 35L35.4 36.4L38.2 33.6" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1 class="portal-heading">Personal Planner</h1>
      <p class="portal-subtitle">Keep track of your daily tasks in one place.</p>

      <div class="pill-tabs">
        <button id="show-login" type="button" class="pill-btn active">Login</button>
        <button id="show-register" type="button" class="pill-btn">Register</button>
      </div>

      <p id="auth-error" class="error hidden"></p>

      <form id="auth-form" autocomplete="off">
        <div id="name-row" class="field hidden">
          <label for="name">Name <span class="optional">(optional)</span></label>
          <input id="name" type="text" maxlength="80" autocomplete="off" placeholder="Your name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="off" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            required
            placeholder="8+ chars, 1 letter & 1 number"
          />
        </div>

        <button id="auth-submit" type="submit" class="pill-primary full-width">Login</button>
      </form>
    </div>
  </main>

  <div id="app-section" class="workspace hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg width="30" height="30" viewBox="0 0 56 56" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="48" height="48" rx="14" fill="#111827" stroke="#CBD5E1" stroke-width="2" />
          <path d="M19 20H37M19 28H31M19 36H26" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="36" cy="35" r="5" fill="#F8FAFC" />
        </svg>
        <span>Personal Planner</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-view="all">All Tasks</button>
        <button type="button" class="nav-item" data-view="open">Open Tasks</button>
        <button type="button" class="nav-item" data-view="completed">Completed</button>
        <button type="button" class="nav-item" data-view="create">+ Create Task</button>
      </nav>

      <div class="sidebar-footer">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" type="button" class="pill-btn full-width">Logout</button>
      </div>
    </aside>

    <main class="main-panel">
      <p id="app-error" class="error hidden"></p>

      <section id="create-panel" class="box hidden">
        <div class="box-header">
          <h2>Create New Task</h2>
          <span class="hint">Add a task</span>
        </div>

        <form id="task-form">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" maxlength="140" required placeholder="Task title" />
          </div>

          <div class="field">
            <label for="description">Description <span class="optional">(optional)</span></label>
            <textarea id="description" rows="3" maxlength="2000" placeholder="Notes or details"></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="field">
              <label for="due-date">Due Date</label>
              <input id="due-date" type="date" />
            </div>
          </div>

          <div class="form-buttons">
            <button type="submit" class="pill-primary">Save Task</button>
            <button type="button" id="cancel-create-btn" class="pill-btn">Back</button>
          </div>
        </form>
      </section>

      <section id="tasks-panel">
        <div class="panel-top">
          <h2 id="panel-title">All Tasks</h2>
          <button type="button" id="quick-add-btn" class="pill-primary">+ New Task</button>
        </div>

        <div class="box filters">
          <div class="row">
            <input id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks" />
            <select id="filter-priority" aria-label="Filter by priority">
              <option value="">All Priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <select id="sort-by" aria-label="Sort tasks">
              <option value="createdAt:desc">Newest First</option>
              <option value="createdAt:asc">Oldest First</option>
              <option value="dueDate:asc">Due Date (Earliest)</option>
              <option value="dueDate:desc">Due Date (Latest)</option>
              <option value="priority:desc">Priority (High–Low)</option>
              <option value="priority:asc">Priority (Low–High)</option>
            </select>
          </div>
        </div>

        <p id="empty-msg" class="empty hidden">No tasks found.</p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
